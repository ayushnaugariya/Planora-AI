[project]
name = "eventra"
version = "1.0.0"
description = "GenAI-powered celebration and event planner"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "google-genai>=1.0",
    "tzdata>=2025.2",  # IANA timezone data for Windows and minimal containers.
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.fastapi.static]
# Preserve the existing cache/security middleware and runtime-served frontend.
cdn = false
exclude = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E741"]
# engine.py holds readable prose data tables (tips, checklists) where wrapping hurts clarity.
"app/services/engine.py" = ["E501"]
