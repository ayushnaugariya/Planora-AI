name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      TRUSTED_PROXY_CIDRS: ""
      TRUST_PROXY: "0"
      K_SERVICE: ""
      EVENTRA_DB_PATH: ${{ runner.temp }}/planora-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "25.9.0"
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip check
      - run: python -m ruff check app tests scripts
      - run: python -m ruff format --check app tests scripts
      - run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=90
      - run: python -m scripts.check_structure
      - name: JavaScript syntax
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem frontend -Recurse -Filter *.js) + @(Get-ChildItem tests/browser -Filter *.mjs)
          foreach ($script in $scripts) {
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax failed: $($script.FullName)" }
          }
      - run: node tests/browser/test_money_display.mjs
      - run: node tests/browser/test_decision_metrics.mjs
      - run: python -m scripts.evaluate_planning
      - run: python -m scripts.evaluate_intelligence
      - run: python -m scripts.evaluate_readiness
      - name: Browser and server restart regression
        run: node tests/browser/browser_workspace_smoke.mjs python
      - name: Release candidate inclusion, size and secret-pattern checks
        run: python -m scripts.audit_release
